# Release archives of proviso, built from the tag v<release version>
# (system.build-version): by the release workflow when a tag is pushed, and
# locally by task snapshot, which publishes nothing.
version: 2

# The Windows version resource, written as task versioninfo writes it, but
# with the release version.
before:
  hooks:
    - >-
      go -C cmd/proviso tool goversioninfo -platform-specific
      -file-version={{ .Version }} -product-version={{ .Version }}
      -ver-major={{ .Major }} -ver-minor={{ .Minor }} -ver-patch={{ .Patch }}
      -product-ver-major={{ .Major }} -product-ver-minor={{ .Minor }} -product-ver-patch={{ .Patch }}
      versioninfo.json

builds:
  - main: ./cmd/proviso
    binary: proviso
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
  # The request skill for business requesters, for every platform: a zip
  # whose one folder is named like the skill, as the Agent Skills format
  # wants it; the tests of its check stay behind.
  - id: request
    meta: true
    name_template: "proviso-request_{{ .Version }}.skill"
    formats: [zip]
    wrap_in_directory: proviso-request
    files:
      - src: request.skill/SKILL.md
        strip_parent: true
      - src: request.skill/references/*.md
        dst: references
        strip_parent: true
      - src: request.skill/scripts/lint_request.py
        dst: scripts
        strip_parent: true
      - src: LICENSE
        strip_parent: true

checksum:
  name_template: checksums.txt

# A snapshot is a local build through the Taskfile, so it carries the
# version the Taskfile gives such a build, as task build does.
snapshot:
  version_template: "{{ .Env.PROVISO_VERSION }}"

# The first release has no tag before it, so its changelog would be the
# whole history; its notes are the header alone.
changelog:
  disable: '{{ eq .PreviousTag "" }}'
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^chore"
      - "^test"
      - "^docs"
      - "^Merge"

release:
  header: |
    Reads the Proviso Model, version {{ .Env.MODEL_VERSION }}.
    {{- if eq .PreviousTag "" }}

    The first release of Proviso. Engineers download the archive for
    their platform and put `proviso` on their path; see the
    [README](https://github.com/bbak/proviso#readme) to set up a
    repository. Business requesters' assistants take
    `proviso-request_{{ .Version }}.skill.zip`, the skill that guides them
    to a request.
    {{- end }}
