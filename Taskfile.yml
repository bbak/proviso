version: '3'

vars:
  BINARY: proviso
  # system.build-version: a local build is the next patch after the latest
  # release tag v<major>.<minor>.<patch> reachable from HEAD, with the
  # pre-release dev, such as 0.1.1-dev after v0.1.0; without a release tag
  # it is given no version, and the binary names itself dev. Only a release
  # build, from its tag, gives a release version.
  VERSION:
    sh: |
      for tag in $(git tag --merged HEAD --list 'v*' --sort=-v:refname 2>/dev/null); do
        v=${tag#v}
        case "$v" in
          *[!0-9.]* | *.*.*.* | .* | *. | *..*) continue ;;
          *.*.*) echo "${v%.*}.$(( ${v##*.} + 1 ))-dev"; break ;;
        esac
      done

env:
  CGO_ENABLED: '0'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the binary into bin/ (never into the root, where proviso/ is the spec tree)
    cmds:
      - task: versioninfo
      - go build -trimpath{{if .VERSION}} -ldflags "-X main.version={{.VERSION}}"{{end}} -o bin/{{.BINARY}}{{exeExt}} ./cmd/{{.BINARY}}

  snapshot:
    desc: Build the release archives into dist/ as a release would, without publishing them
    vars:
      MODEL_VERSION:
        sh: go run ./cmd/{{.BINARY}} version | sed -n 's/^model //p'
    env:
      PROVISO_VERSION: '{{.VERSION | default "dev"}}'
      MODEL_VERSION: '{{.MODEL_VERSION}}'
    cmds:
      - goreleaser release --snapshot --clean

  versioninfo:
    desc: Write the Windows version resource of the binary, with the version of a local build
    internal: true
    dir: cmd/{{.BINARY}}
    cmds:
      # One resource_windows_<arch>.syso per architecture, which go build
      # links into a Windows binary only. A build given no version leaves
      # the version fields empty.
      - go tool goversioninfo -platform-specific{{if .VERSION}} -file-version={{.VERSION}} -product-version={{.VERSION}} -propagate-ver-strings{{end}} versioninfo.json

  test:
    desc: Run the coding agent's unit tests
    cmds:
      - go test ./cmd/... ./internal/... {{.CLI_ARGS}}

  acceptance:
    desc: Run the testing agent's acceptance tests (they build the binary themselves)
    cmds:
      - go test -timeout 30m ./acceptance/... {{.CLI_ARGS}}

  install:
    desc: Install the kit into this repository again, after every change of internal/kit/
    cmds:
      # init never overwrites, so the installed copies are removed first;
      # they are ignored by git, and internal/kit/ is their only source.
      - rm -f .claude/agents/proviso-*.md
      - rm -rf .claude/skills/proviso-*
      - go run ./cmd/{{.BINARY}} init

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go source
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  spec:
    desc: Check the spec tree; on main, also that verify finds it may be the baseline
    cmds:
      # An amendment branch has no recorded coherence check until near
      # acceptance, which runs verify itself, so only main must pass it;
      # verify refuses a tree with lint errors anyway.
      - |
        if [ "$(git branch --show-current)" = main ]; then
          go run ./cmd/{{.BINARY}} verify
        else
          go run ./cmd/{{.BINARY}} lint
        fi

  check:
    desc: Local quality gate, run before every push
    cmds:
      - task: spec
      - task: vet
      - task: test
      - task: acceptance
