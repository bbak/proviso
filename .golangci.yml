version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        # The defaults of golangci-lint leave these out as well.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan's law: a negated condition such as !(a && b) often
        # reads as the case it excludes.
        - -QF1001
  exclusions:
    # Leaves out the unchecked errors of Close and the like, which Go
    # code commonly drops.
    presets:
      - std-error-handling
